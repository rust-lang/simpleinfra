[package]
name = "fastly-access-log"
description = "Shared access-log schema and collection helpers for Fastly Compute services"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
derive_builder = "0.20.2"
fastly = "0.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3.17", features = ["serde-human-readable"] }
