[package]
name = "fastly-compute-project"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fastly = "0.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.25.0", features = ["v4", "fast-rng"] }
tracing = "0.1"
tracing-serde = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }

[profile.fastly-release]
inherits = "release"
debug = 1
codegen-units = 1
lto = "fat"
